# Static metadata for Olveczky Lab social behavior NWB conversion.
# Fields that vary per session (subject_id, session_start_time, session_id,
# rat identity, genotype) are set programmatically in convert_session.py.

NWBFile:
  experiment_description: >
    Multi-genotype comparison of rat social behavior using 3D pose estimation.
    Two rats are placed together in an arena and recorded with six synchronized
    Basler cameras. 3D keypoints are estimated using sDANNCE (social DANNCE).
    Genotype groups include SCN2A, ARID1B, CHD8, GRINB, NRXN1, and Long-Evans
    WT.
  session_description: >
    Social behavior experiment in the Olveczky Lab. Two rats of defined
    genotypes were placed together in an arena and their behavior was recorded
    with a six-camera system. 3D pose estimation was performed using sDANNCE.
  institution: Harvard University
  lab: Olveczky
  related_publications:
    - "doi:10.1016/j.cell.2025.01.044"
  experimenter:
    - Klibaite, Ugne
    - Li, Tianqing
    - Aldarondo, Diego
    - Alkoad, Jumana
    - Olveczky, Bence
    - Dunn, Timothy
    - Cao, Lily
  keywords:
    - social behavior
    - 3D pose estimation
    - sDANNCE
    - DANNCE
    - multi-camera
    - skin contacts
    - Rattus norvegicus

Subject:
  species: Rattus norvegicus
  # strain, sex, subject_id, date_of_birth, genotype, weight set programmatically from ugne_rat_log.xlsx
  # and ugne_recording_info.xlsx via get_subject_metadata()

# External resources (HERD). NeuroConv writes every term stated here into the file under
# /general/external_resources during run_conversion. Each map is keyed by the exact value it
# annotates (Subject.species, Subject.strain, Skeleton node name). IDs checked against the EBI
# Ontology Lookup Service (UBERON, NCBITaxon) and the SciCrunch resolver (RRID) on 2026-10-16.
ExternalResources:
  species:
    Rattus norvegicus: { id: "NCBITaxon:10116", uri: "http://purl.obolibrary.org/obo/NCBITaxon_10116" }
  # One entry per cohort; keys must match STRAINS[cohort]["strain"] in utils/subject_metadata.py
  # (convert_session.py checks that the subject's strain has its RRID here).
  strain:
    Long-Evans: { id: "RRID:RGD_2308852", uri: "https://scicrunch.org/resolver/RRID:RGD_2308852" }  # Crl:LE, Charles River
    LE-Scn2a-em1Mcwi: { id: "RRID:RGD_25394530", uri: "https://scicrunch.org/resolver/RRID:RGD_25394530" }
    LE-Cntnap2-em1Mcwi: { id: "RRID:RGD_25330087", uri: "https://scicrunch.org/resolver/RRID:RGD_25330087" }
    LE-Chd8-em1Mcwi: { id: "RRID:RGD_25330088", uri: "https://scicrunch.org/resolver/RRID:RGD_25330088" }
    LE-Grin2b-em1Mcwi: { id: "RRID:RGD_14394515", uri: "https://scicrunch.org/resolver/RRID:RGD_14394515" }
    LE-Arid1b-em1Mcwi: { id: "RRID:RGD_14394518", uri: "https://scicrunch.org/resolver/RRID:RGD_14394518" }
    LE-Fmr1-em2Mcwi: { id: "RRID:RGD_11553873", uri: "https://scicrunch.org/resolver/RRID:RGD_11553873" }
    LE-Nrxn1-em1Mcwi: { id: "RRID:RGD_25330089", uri: "https://scicrunch.org/resolver/RRID:RGD_25330089" }
  # rat23 skeleton nodes. UBERON has no left/right terms, so both sides share one term (YAML
  # anchors), and the three spine points share the vertebral column term.
  anatomy:
    Snout: { id: "UBERON:0006333", uri: "http://purl.obolibrary.org/obo/UBERON_0006333" }  # snout
    EarLeft: &ear { id: "UBERON:0001691", uri: "http://purl.obolibrary.org/obo/UBERON_0001691" }  # external ear
    EarRight: *ear
    SpineFront: &spine { id: "UBERON:0001130", uri: "http://purl.obolibrary.org/obo/UBERON_0001130" }  # vertebral column
    SpineMiddle: *spine
    SpineLow: *spine
    TailBase: { id: "UBERON:0002415", uri: "http://purl.obolibrary.org/obo/UBERON_0002415" }  # tail (UBERON has no tail-base term)
    ShoulderLeft: &shoulder { id: "UBERON:0001467", uri: "http://purl.obolibrary.org/obo/UBERON_0001467" }  # shoulder
    ShoulderRight: *shoulder
    ElbowLeft: &elbow { id: "UBERON:0001461", uri: "http://purl.obolibrary.org/obo/UBERON_0001461" }  # elbow
    ElbowRight: *elbow
    WristLeft: &wrist { id: "UBERON:0004452", uri: "http://purl.obolibrary.org/obo/UBERON_0004452" }  # carpal region
    WristRight: *wrist
    HandLeft: &hand { id: "UBERON:0002398", uri: "http://purl.obolibrary.org/obo/UBERON_0002398" }  # manus (forepaw)
    HandRight: *hand
    HipLeft: &hip { id: "UBERON:0001464", uri: "http://purl.obolibrary.org/obo/UBERON_0001464" }  # hip
    HipRight: *hip
    KneeLeft: &knee { id: "UBERON:0001465", uri: "http://purl.obolibrary.org/obo/UBERON_0001465" }  # knee
    KneeRight: *knee
    AnkleLeft: &ankle { id: "UBERON:0004454", uri: "http://purl.obolibrary.org/obo/UBERON_0004454" }  # tarsal region
    AnkleRight: *ankle
    FootLeft: &foot { id: "UBERON:0002387", uri: "http://purl.obolibrary.org/obo/UBERON_0002387" }  # pes (hindpaw)
    FootRight: *foot
